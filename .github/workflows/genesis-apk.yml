name: Genesis Android
on:
  workflow_dispatch:
  push:
    paths:
      - apps/mobile/**
      - .github/workflows/genesis-apk.yml

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.0"
          channel: stable

      - name: Generate Android project
        working-directory: apps/mobile
        run: flutter create --platforms=android --project-name genesis_ai --org com.genesisai .

      - name: Apply Genesis AI branding
        working-directory: apps/mobile
        shell: bash
        run: |
          mkdir -p android/app/src/main/res/drawable
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          text = text.replace('android:icon="@mipmap/ic_launcher"', 'android:icon="@drawable/genesis_icon"')
          manifest.write_text(text)
          strings = Path("android/app/src/main/res/values/strings.xml")
          text = strings.read_text()
          text = re.sub(r'<string name="app_name">.*?</string>', '<string name="app_name">Genesis AI</string>', text)
          strings.write_text(text)
          Path("android/app/src/main/res/drawable/genesis_icon.xml").write_text("""<?xml version="1.0" encoding="utf-8"?>
<vector xmlns:android="http://schemas.android.com/apk/res/android"
    android:width="108dp"
    android:height="108dp"
    android:viewportWidth="108"
    android:viewportHeight="108">
    <path android:fillColor="#080808" android:pathData="M0,0h108v108h-108z"/>
    <path android:fillColor="#FFFFFF" android:pathData="M54,15l7,28 28,11 -28,11 -7,28 -7,-28 -28,-11 28,-11z"/>
    <path android:fillColor="#9CA3AF" android:pathData="M88,13h7v7h-7z"/>
    <path android:fillColor="#9CA3AF" android:pathData="M13,88h5v5h-5z"/>
</vector>
""")
          PY

      - name: Dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Analyze
        working-directory: apps/mobile
        run: flutter analyze

      - name: Test
        working-directory: apps/mobile
        run: flutter test

      - name: Build APK
        working-directory: apps/mobile
        run: flutter build apk --release

      - name: Build AAB
        working-directory: apps/mobile
        run: flutter build appbundle --release

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: genesis-android-release
          path: |
            apps/mobile/build/app/outputs/flutter-apk/app-release.apk
            apps/mobile/build/app/outputs/bundle/release/app-release.aab
