name: Genesis Android
on:
  workflow_dispatch:
  push:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/genesis-android.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.0"
          channel: stable
      - name: Dependencies
        run: cd apps/mobile && flutter pub get
      - name: Analyze
        run: cd apps/mobile && flutter analyze
      - name: Test
        run: cd apps/mobile && flutter test
      - name: Build APK
        run: cd apps/mobile && flutter build apk --release
      - name: Build AAB
        run: cd apps/mobile && flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: genesis-android-release
          path: |
            apps/mobile/build/app/outputs/flutter-apk/app-release.apk
            apps/mobile/build/app/outputs/bundle/release/app-release.aab
