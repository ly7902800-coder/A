name: Genesis AI - Import Flutter IDE

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/import-flutter-ide.yml"

permissions:
  contents: write

jobs:
  import-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true

      - name: Replace repository with upstream Flutter IDE source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/flutter_ide
          git clone --depth 1 --branch main https://github.com/ankurg132/flutter_ide.git /tmp/flutter_ide

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +

          cp -a /tmp/flutter_ide/. .

          test -f pubspec.yaml
          test -f lib/main.dart
          test -f lib/editor_screen.dart

      - name: Apply only required identity changes
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/^name: flutter_ide$/name: genesis_ai/' pubspec.yaml
          find lib test -type f -name '*.dart' -print0 | while IFS= read -r -d '' f; do
            sed -i 's/package:flutter_ide\//package:genesis_ai\//g' "$f"
          done
          sed -i "s/title: 'Flutter Demo'/title: 'Genesis AI'/" lib/main.dart

      - name: Generate Android platform only
        shell: bash
        run: |
          set -euo pipefail
          flutter create --platforms=android --org com.genesisai --project-name genesis_ai .

      - name: Fix Android application label only
        shell: bash
        run: |
          set -euo pipefail
          if [ -f android/app/src/main/AndroidManifest.xml ]; then
            sed -i 's/android:label="[^"]*"/android:label="Genesis AI"/' android/app/src/main/AndroidManifest.xml
          fi

      - name: Verify source UI files
        shell: bash
        run: |
          set -euo pipefail
          test -f lib/editor_screen.dart
          test -f lib/file_tree.dart
          test -f lib/flutter_sidebar.dart
          test -f lib/output_panel.dart
          test -f lib/pubdev_sidebar.dart
          test -f lib/widgets/editor/activity_bar.dart
          test -f lib/widgets/editor/editor_tabs.dart
          test -f lib/widgets/editor/quick_open_dialog.dart
          test -f lib/widgets/editor/status_bar.dart
          test -f lib/widgets/editor/welcome_screen.dart
          test -f lib/widgets/git/git_sidebar.dart

      - name: Analyze
        run: flutter pub get && flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Verify APK
        run: test -s build/app/outputs/flutter-apk/app-release.apk

      - name: Create permanent APK workflow
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/workflows
          cat > .github/workflows/android-apk.yml <<'YAML'
          name: Genesis AI Android APK

          on:
            workflow_dispatch:
            push:
              branches:
                - main

          permissions:
            contents: read

          jobs:
            build:
              runs-on: ubuntu-latest
              steps:
                - name: Checkout
                  uses: actions/checkout@v4
                - name: Set up JDK 17
                  uses: actions/setup-java@v5
                  with:
                    distribution: temurin
                    java-version: "17"
                - name: Set up Android SDK
                  uses: android-actions/setup-android@v4
                  with:
                    packages: "platform-tools"
                - name: Set up Flutter
                  uses: subosito/flutter-action@v2
                  with:
                    flutter-version: "3.47.6"
                    channel: stable
                    cache: true
                - name: Get dependencies
                  run: flutter pub get
                - name: Analyze
                  run: flutter analyze
                - name: Test
                  run: flutter test
                - name: Build release APK
                  run: flutter build apk --release
                - name: Verify APK
                  run: test -s build/app/outputs/flutter-apk/app-release.apk
                - name: Upload APK
                  uses: actions/upload-artifact@v4
                  with:
                    name: genesis-ai-apk
                    path: build/app/outputs/flutter-apk/app-release.apk
                    if-no-files-found: error
                    retention-days: 30
          YAML

      - name: Commit imported project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Genesis AI Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import upstream Flutter IDE as Genesis AI" || exit 0
          git push origin HEAD:main
