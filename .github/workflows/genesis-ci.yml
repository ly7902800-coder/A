name: Genesis CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter 3.47
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create --platforms=android --project-name genesis_ai --org com.genesisai .

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: genesis-apk-${{ github.run_number }}
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk

      - name: Publish APK release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "genesis-ci-${{ github.run_number }}" \
            apps/mobile/build/app/outputs/flutter-apk/app-release.apk \
            --title "Genesis AI APK CI ${{ github.run_number }}" \
            --notes "Verified by Genesis CI from ${{ github.sha }}."
