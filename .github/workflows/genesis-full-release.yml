name: Genesis AI Full Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android, AAB and Web
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Generate Android and Web platforms
        working-directory: apps/mobile
        run: flutter create --platforms=android,web --project-name genesis_ai --org com.genesisai .

      - name: Configure Android
        working-directory: apps/mobile
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path("android/app/build.gradle.kts")
          text = gradle.read_text()

          if "isCoreLibraryDesugaringEnabled = true" not in text:
              text = text.replace(
                  "android {",
                  """android {
              compileOptions {
                  isCoreLibraryDesugaringEnabled = true
              }""",
                  1,
              )

          dependency = '    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")'
          if "coreLibraryDesugaring(" not in text:
              if "dependencies {" in text:
                  text = text.replace("dependencies {", "dependencies {\n" + dependency, 1)
              else:
                  text += "\n\ndependencies {\n" + dependency + "\n}\n"

          gradle.write_text(text)

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          ms = manifest.read_text()
          ms = re.sub(r'android:label="[^"]*"', 'android:label="Genesis AI"', ms, count=1)
          ms = re.sub(r'android:icon="[^"]*"', 'android:icon="@drawable/genesis_icon"', ms, count=1)

          if "<application" in ms:
              if 'android:label="Genesis AI"' not in ms:
                  ms = ms.replace("<application", '<application android:label="Genesis AI"', 1)
              if 'android:icon="@drawable/genesis_icon"' not in ms:
                  ms = ms.replace("<application", '<application android:icon="@drawable/genesis_icon"', 1)

          manifest.write_text(ms)

          icon = Path("android/app/src/main/res/drawable/genesis_icon.xml")
          icon.parent.mkdir(parents=True, exist_ok=True)
          icon.write_text("""<vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#050B18" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#42A5F5" android:pathData="M54,12 L91,35 L75,70 L54,96 L33,70 L17,35 Z"/>
              <path android:fillColor="#0D47A1" android:pathData="M54,12 L91,35 L54,54 L17,35 Z"/>
              <path android:fillColor="#90CAF9" android:pathData="M54,54 L75,70 L54,96 L33,70 Z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M54,29 L70,39 L54,49 L38,39 Z"/>
              <path android:fillColor="#1565C0" android:pathData="M54,49 L70,39 L70,57 L54,68 Z"/>
              <path android:fillColor="#64B5F6" android:pathData="M54,49 L38,39 L38,57 L54,68 Z"/>
          </vector>
          """)

          print("Android configuration complete.")
          PY

          grep -q 'isCoreLibraryDesugaringEnabled = true' android/app/build.gradle.kts
          grep -q 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")' android/app/build.gradle.kts

      - name: Get Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Flutter analyze
        working-directory: apps/mobile
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Flutter tests
        working-directory: apps/mobile
        run: flutter test

      - name: Build Web
        working-directory: apps/mobile
        run: flutter build web --release

      - name: Build APK
        working-directory: apps/mobile
        run: flutter build apk --release

      - name: Verify APK
        run: |
          test -s apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          ls -lh apps/mobile/build/app/outputs/flutter-apk/app-release.apk

      - name: Build AAB
        working-directory: apps/mobile
        run: flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: genesis-apk-${{ github.run_number }}
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: genesis-aab-${{ github.run_number }}
          path: apps/mobile/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload Web
        uses: actions/upload-artifact@v4
        with:
          name: genesis-web-${{ github.run_number }}
          path: apps/mobile/build/web
          if-no-files-found: error

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "genesis-ai-${{ github.run_number }}" \
            apps/mobile/build/app/outputs/flutter-apk/app-release.apk \
            apps/mobile/build/app/outputs/bundle/release/app-release.aab \
            --title "Genesis AI ${{ github.run_number }}" \
            --notes "Verified Genesis AI Android APK/AAB/Web build from commit ${{ github.sha }}."
