name: Genesis Execution Worker

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Build target"
        required: true
        type: choice
        options:
          - node
          - python
          - flutter-apk
          - flutter-aab
          - blender
          - godot
          - unity
          - unreal
      repository:
        description: "Repository owner/name"
        required: true
        default: "ly7902800-coder/A"
      ref:
        description: "Git ref"
        required: true
        default: "main"

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout requested project
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}

      - name: Node capability
        if: inputs.target == 'node'
        run: |
          node --version
          npm --version
          npm ci
          npm run build

      - name: Python capability
        if: inputs.target == 'python'
        run: |
          python3 --version
          python3 -m compileall .

      - name: Flutter setup
        if: inputs.target == 'flutter-apk' || inputs.target == 'flutter-aab'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.0"
          channel: stable

      - name: Flutter build
        if: inputs.target == 'flutter-apk' || inputs.target == 'flutter-aab'
        working-directory: apps/mobile
        run: |
          flutter pub get
          flutter analyze
          if [ "${{ inputs.target }}" = "flutter-apk" ]; then
            flutter build apk --release
          else
            flutter build appbundle --release
          fi

      - name: Blender setup
        if: inputs.target == 'blender'
        run: |
          sudo apt-get update
          sudo apt-get install -y blender
          blender --version
          blender --background --python-expr "print('Genesis Blender worker ready')"

      - name: Godot setup
        if: inputs.target == 'godot'
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.5.1-stable_linux.x86_64
          /tmp/godot/Godot_v4.5.1-stable_linux.x86_64 --headless --editor --quit

      - name: Unity capability
        if: inputs.target == 'unity'
        run: |
          if command -v unity-editor >/dev/null 2>&1; then
            unity-editor -batchmode -quit -nographics -projectPath .
          else
            echo "::error::Unity Editor is not installed on this GitHub-hosted runner. Use a licensed Unity runner/self-hosted worker."
            exit 2
          fi

      - name: Unreal capability
        if: inputs.target == 'unreal'
        run: |
          if command -v UnrealEditor >/dev/null 2>&1; then
            UnrealEditor -run=DerivedDataCache -unattended -nop4
          else
            echo "::error::Unreal Engine is not installed on this GitHub-hosted runner. Use an Unreal-capable cloud/self-hosted runner."
            exit 2
          fi

      - name: Collect artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: genesis-${{ inputs.target }}-${{ github.run_id }}
          path: |
            apps/mobile/build/app/outputs/flutter-apk/*.apk
            apps/mobile/build/app/outputs/bundle/release/*.aab
            dist/**
            build/**
            Builds/**
          if-no-files-found: ignore
