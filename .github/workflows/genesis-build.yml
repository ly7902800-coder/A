name: Genesis Build Factory
on:
  workflow_dispatch:
    inputs:
      target:
        required: true
        type: choice
        options: [web, apk, aab]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Web build
        if: inputs.target == 'web'
        run: npm run build
      - name: Setup Flutter
        if: inputs.target == 'apk' || inputs.target == 'aab'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
      - name: Flutter dependencies
        if: inputs.target == 'apk' || inputs.target == 'aab'
        run: cd apps/mobile && flutter pub get
      - name: Build APK
        if: inputs.target == 'apk'
        run: cd apps/mobile && flutter build apk --release
      - name: Build AAB
        if: inputs.target == 'aab'
        run: cd apps/mobile && flutter build appbundle --release
      - name: Upload web artifact
        if: inputs.target == 'web'
        uses: actions/upload-artifact@v4
        with:
          name: genesis-web
          path: '**/dist/**'
      - name: Upload APK
        if: inputs.target == 'apk'
        uses: actions/upload-artifact@v4
        with:
          name: genesis-apk
          path: 'apps/mobile/build/app/outputs/flutter-apk/*.apk'
      - name: Upload AAB
        if: inputs.target == 'aab'
        uses: actions/upload-artifact@v4
        with:
          name: genesis-aab
          path: 'apps/mobile/build/app/outputs/bundle/release/*.aab'
