name: genesis_ai
description: Genesis AI cloud-first assistant and app builder.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^3.4.3
  flutter_bloc: ^9.1.1
  provider: ^6.1.5+1

  # Navigation
  go_router: ^18.0.2

  # Networking
  dio: ^5.11.1
  http: ^1.5.0

  # Firebase
  firebase_core: ^4.15.0
  cloud_firestore: ^6.10.0
  firebase_auth: ^6.7.0

  # Local storage
  hive: ^2.2.3
  isar: ^3.1.0+1
  shared_preferences: ^2.5.5

  # Models / serialization
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # Animation
  lottie: ^3.6.1
  rive: ^0.14.11

  # Localization
  intl: ^0.20.2

  # Device integrations
  camera: ^0.12.1
  image_picker: ^1.2.3
  geolocator: ^14.1.1
  google_maps_flutter: ^2.18.2
  url_launcher: ^6.3.2
  permission_handler: ^13.0.2
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.1
  webview_flutter: ^4.14.1
  file_picker: ^13.1.0
  path_provider: ^2.1.5
  record: ^7.1.1
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.10.4
  freezed: ^3.2.3
  json_serializable: ^6.14.1
  flutter_gen_runner: ^5.12.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
  image_path: assets/icon/icon.png
